# ============================================================
# Lucyware Inc. — Cloudflare Pages 설정 파일 (단일 진실 공급원)
# Phase 1: 정적 사이트  /  Phase 2: Functions + Hyperdrive(MariaDB)
# 문서: https://developers.cloudflare.com/pages/functions/wrangler-configuration/
# ============================================================

# Cloudflare Pages 의 실제 프로젝트 이름과 같아야 한다. 저장소 이름을 따라
# `com-home` 으로 만들어졌다 — 여기에 다른 이름을 적어 두면 나중에 wrangler 로
# 직접 배포할 때 엉뚱한 프로젝트를 새로 만든다 (2026-08-18 확인).
name = "com-home"
compatibility_date = "2025-09-23"
compatibility_flags = ["nodejs_compat"]   # mysql2 드라이버 사용 위해 Phase 2 필수, Phase 1부터 명시

# 정적 산출물 디렉터리.
# Eleventy 가 src/ 의 템플릿을 정적 HTML 로 찍어 dist/ 에 넣는다.
# 방문자에게 내려가는 것은 여전히 순수 HTML/CSS/JS 이며, 빌드는 헤더·푸터를
# 11벌 복사하지 않기 위한 것이다(빌드 명령: npm run build).
pages_build_output_dir = "dist"

# ============================================================
# [Phase 2] Hyperdrive → 사내 MariaDB
#
# 문의 폼(/api/contact)이 이 바인딩으로 문의 테이블에 INSERT 한다.
# **바인딩이 없으면 함수가 503 을 돌려주고 화면은 메일 앱을 여는 예전 경로로
# 넘어간다** — 준비가 안 된 동안에도 문의를 잃지 않는다.
#
# 준비 절차는 docs/CONTACT_SETUP.md 에 순서대로 적었다. 요약하면:
#   1) 경유 서버에 cloudflared 를 띄워 DB 대역을 Cloudflare 사설망에 연결
#   2) npx wrangler hyperdrive create lucyware-mariadb \
#        --connection-string="mysql://USER:PASSWORD@DB주소:3306/DBNAME" \
#        --access-client-id=... --access-client-secret=...
#   3) 출력된 id 를 아래 id 에 넣고 주석을 푼다
#
# **바인딩은 이 파일에만 적는다 — 대시보드가 아니다.** 이 파일이 있는 Pages
# 프로젝트에서는 이 파일이 단일 진실 공급원이 되어 같은 항목을 대시보드에서
# 고칠 수 없다 — Cloudflare 문서의 말로는 "This file becomes the source of
# truth when used, meaning that you cannot edit the same fields in the
# dashboard" 다. 대시보드에만 걸어 두면 어느 쪽이 참인지 헷갈리는 정도가
# 아니라 **아예 먹지 않는다.**
#
# **id 는 비밀이 아니다.** 자격증명은 Cloudflare 쪽 Hyperdrive 구성이 들고 있고
# 여기 남는 것은 그 구성을 가리키는 이름뿐이라, 커밋해도 된다.
#
# **로컬 접속 문자열은 여기 적지 않는다.** `localConnectionString` 에 적으면
# 비밀번호가 저장소에 남는다. 그 자리는 커밋되지 않는 `.env` 의
# CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE 이며, 템플릿은
# `.env.example` · 띄우는 명령은 `npm run dev:api` 다.
# ============================================================
# [[hyperdrive]]
# binding = "HYPERDRIVE"   # 함수가 env.HYPERDRIVE 로 읽는다. 이름을 바꾸면 함수도 함께 고친다
# id = "<wrangler hyperdrive create 가 출력한 ID>"
