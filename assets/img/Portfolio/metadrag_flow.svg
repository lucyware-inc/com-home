<!-- 홈 「Why metadata」 구역용 요약 도식.
     상세 페이지의 metadrag_workflow.svg 를 세 단계 이름과 산출물만 남겨 줄인 것이다.

     톤은 바로 위 Solution 구역의 lucyware.AI_flow.svg 와 같다 — 두 도식이
     한 화면에서 위아래로 스크롤되므로 톤이 다르면 그 장만 딴 데서 온 것처럼
     보인다. 배경을 비워 .alt__media 의 격자가 그대로 비치게 한다.
     색은 base.css 토큰에서 실측한 값이다:
       흰 카드 #FFFFFF · 테두리 #E3E7ED · 제목 #1B2432 · 본문 #6B7684
     다만 강조는 브랜드 오렌지가 아니라 MetaDRAG 제품색 #0091AA 를 쓴다 —
     이 구역은 그 제품 하나를 가리키고, 제품 페이지 머리띠와 같은 색이다.

     글꼴은 base.css 의 font-sans 토큰과 같은 스택을 적어 둔다. img 태그로
     불려서 사이트 CSS 가 닿지 않는다.
     (XML 주석 안에는 하이픈 두 개를 연달아 쓸 수 없다.) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" width="520" height="400"
     role="img" aria-label="MetaDRAG 3단계 파이프라인"
     style="font-family: 'Pretendard Variable', Pretendard, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;">
  <defs>
    <filter id="md-shadow" x="-10%" y="-30%" width="120%" height="180%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#151C27" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- 1. Design -->
  <g filter="url(#md-shadow)">
    <rect x="14" y="28" width="492" height="84" rx="12" fill="#FFFFFF" stroke="#E3E7ED" stroke-width="1"/>
  </g>
  <text x="34" y="62" font-size="11" font-weight="800" fill="#0091AA" letter-spacing="0.8">01</text>
  <text x="60" y="62" font-size="16" font-weight="700" fill="#1B2432">Design</text>
  <text x="34" y="88" font-size="12.5" fill="#6B7684">표준 설계 → Standard Metadata Repository</text>

  <path d="M 260 122 V 144" stroke="#0091AA" stroke-width="2" stroke-dasharray="4 4"/>
  <polygon points="260,152 254,142 266,142" fill="#0091AA"/>

  <!-- 2. Integration — 가운데가 이 제품의 고유한 자리라 테두리로만 힘을 준다 -->
  <g filter="url(#md-shadow)">
    <rect x="14" y="158" width="492" height="84" rx="12" fill="#FFFFFF" stroke="#0091AA" stroke-width="2"/>
  </g>
  <text x="34" y="192" font-size="11" font-weight="800" fill="#0091AA" letter-spacing="0.8">02</text>
  <text x="60" y="192" font-size="16" font-weight="800" fill="#1B2432">Integration</text>
  <text x="34" y="218" font-size="12.5" fill="#6B7684">Master · Meta · Mart 합성 → M³ Dataset</text>

  <path d="M 260 252 V 274" stroke="#0091AA" stroke-width="2" stroke-dasharray="4 4"/>
  <polygon points="260,282 254,272 266,272" fill="#0091AA"/>

  <!-- 3. Implementation -->
  <g filter="url(#md-shadow)">
    <rect x="14" y="288" width="492" height="84" rx="12" fill="#FFFFFF" stroke="#E3E7ED" stroke-width="1"/>
  </g>
  <text x="34" y="322" font-size="11" font-weight="800" fill="#0091AA" letter-spacing="0.8">03</text>
  <text x="60" y="322" font-size="16" font-weight="700" fill="#1B2432">Implementation</text>
  <text x="34" y="348" font-size="12.5" fill="#6B7684">온톨로지 구축 → Business Context Object</text>
</svg>
