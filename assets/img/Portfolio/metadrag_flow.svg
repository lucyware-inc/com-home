<!-- 홈 「Why metadata」 구역용 요약 도식.
     상세 페이지의 metadrag_workflow.svg 를 세 단계 이름과 산출물만 남겨 줄인 것이다.

     구조와 초점 규칙은 바로 위 Solution 구역의 lucyware.AI_flow.svg 와 같다 —
     빌드가 index.html 안에 펴 넣고(inlineSvg), 켜진 칸은 is-active 가 정하며,
     켜진 모습은 site.css 의 dgm 규칙이 정한다. 두 도식이 한 화면에서 위아래로
     스크롤되므로 모양도 움직임도 같아야 한다. 다른 것은 강조색 하나뿐이다 —
     브랜드 오렌지가 아니라 MetaDRAG 제품색을 쓴다. 이 구역은 그 제품 하나를
     가리키고, 제품 페이지 머리띠와 같은 색이다.

     여기 박힌 색·글꼴은 이 파일을 브라우저로 직접 열어 볼 때의 대비책이다.
     페이지 안에서는 CSS 가 토큰 값으로 덮어쓴다.
     (XML 주석 안에는 하이픈 두 개를 연달아 쓸 수 없다.) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" width="520" height="400"
     class="alt__diagram dgm dgm--md" data-flow-cycle="7000"
     role="img" aria-label="MetaDRAG 3단계 파이프라인. 01 Design 이 Standard Metadata Repository 를, 02 Integration 이 M³ Dataset 을, 03 Implementation 이 Business Context Object 를 만듭니다."
     style="font-family: 'Pretendard Variable', Pretendard, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;">
  <defs>
    <filter id="md-shadow" x="-10%" y="-30%" width="120%" height="180%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#151C27" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- 1. Design -->
  <g class="dgm__step" data-step="1">
    <g filter="url(#md-shadow)">
      <rect class="dgm__card" x="14" y="28" width="492" height="84" rx="12"
            fill="#FFFFFF" stroke="#E3E7ED" stroke-width="1"/>
    </g>
    <text class="dgm__num" x="34" y="62" font-size="11" font-weight="800" fill="#0091AA" letter-spacing="0.8">01</text>
    <text class="dgm__title" x="60" y="62" font-size="16" font-weight="700" fill="#1B2432">Design</text>
    <text class="dgm__desc" x="34" y="88" font-size="12.5" fill="#6B7684">표준 설계 → Standard Metadata Repository</text>
  </g>

  <g class="dgm__conn">
    <path d="M 260 122 V 144" stroke="#0091AA" stroke-width="2" stroke-dasharray="4 4"/>
    <polygon points="260,152 254,142 266,142" fill="#0091AA"/>
  </g>

  <!-- 2. Integration — 스크립트가 죽거나 모션을 줄여 달라는 설정이면 초점이
       여기 멈춘다. 가운데가 이 제품의 고유한 자리라 정지 화면의 자리로 맞다. -->
  <g class="dgm__step is-active" data-step="2">
    <g filter="url(#md-shadow)">
      <rect class="dgm__card" x="14" y="158" width="492" height="84" rx="12"
            fill="#FFFFFF" stroke="#0091AA" stroke-width="2"/>
    </g>
    <text class="dgm__num" x="34" y="192" font-size="11" font-weight="800" fill="#0091AA" letter-spacing="0.8">02</text>
    <text class="dgm__title" x="60" y="192" font-size="16" font-weight="800" fill="#1B2432">Integration</text>
    <text class="dgm__desc" x="34" y="218" font-size="12.5" fill="#6B7684">Master · Meta · Mart 합성 → M³ Dataset</text>
  </g>

  <g class="dgm__conn">
    <path d="M 260 252 V 274" stroke="#0091AA" stroke-width="2" stroke-dasharray="4 4"/>
    <polygon points="260,282 254,272 266,272" fill="#0091AA"/>
  </g>

  <!-- 3. Implementation -->
  <g class="dgm__step" data-step="3">
    <g filter="url(#md-shadow)">
      <rect class="dgm__card" x="14" y="288" width="492" height="84" rx="12"
            fill="#FFFFFF" stroke="#E3E7ED" stroke-width="1"/>
    </g>
    <text class="dgm__num" x="34" y="322" font-size="11" font-weight="800" fill="#0091AA" letter-spacing="0.8">03</text>
    <text class="dgm__title" x="60" y="322" font-size="16" font-weight="700" fill="#1B2432">Implementation</text>
    <text class="dgm__desc" x="34" y="348" font-size="12.5" fill="#6B7684">온톨로지 구축 → Business Context Object</text>
  </g>
</svg>
