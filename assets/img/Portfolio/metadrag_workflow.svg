<!-- MetaDRAG 제품 페이지의 전체 워크플로우.
     세 단계가 각각 「전담 모듈 → 주요 프로세스 3 → 산출물」 로 이어지고,
     앞 단계의 산출물이 다음 단계의 입력이 된다.

     톤은 이 페이지의 본문(밝은 면)을 따른다. Lucyware.AI 쪽 구조도는 어두운데,
     그것은 받은 원본이라 그대로 둔 것이고 여기서는 페이지에 맞춘다 —
     제품 페이지 머리가 밝은 면이라는 것이 이 사이트의 규칙이다.
     강조색은 이 제품의 accent(#0091AA)를 쓴다.

     글꼴은 base.css 의 font-sans 토큰과 같은 스택이다. img 태그로 불려서
     사이트 CSS 가 닿지 않으므로 여기 적지 않으면 본문과 다른 글꼴이 된다.
     (XML 주석 안에는 하이픈 두 개를 연달아 쓸 수 없다.)

     글자를 고치면 폭을 다시 잰다 — SVG 의 text 는 저절로 줄바꿈하지 않아
     칸보다 길면 그냥 흘러나간다. 칸 안쪽 폭은 220px 다. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" width="900" height="540"
     role="img" aria-label="MetaDRAG 워크플로우 — Design, Integration, Implementation 3단계"
     style="font-family: 'Pretendard Variable', Pretendard, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;">
  <defs>
    <filter id="wf-shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#151C27" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="900" height="540" fill="#F4F6F9"/>

  <!-- 옅은 격자 — 본문의 .alt__media 와 같은 결 -->
  <g stroke="#E3E7ED" stroke-width="1">
    <path d="M 150 0 V 540 M 300 0 V 540 M 450 0 V 540 M 600 0 V 540 M 750 0 V 540"/>
    <path d="M 0 135 H 900 M 0 270 H 900 M 0 405 H 900"/>
  </g>

  <!-- ── 단계 1: Design ───────────────────────────────── -->
  <g filter="url(#wf-shadow)">
    <rect x="16" y="24" width="256" height="452" rx="14" fill="#FFFFFF" stroke="#E3E7ED" stroke-width="1"/>
  </g>
  <text x="38" y="58" font-size="11" font-weight="800" fill="#0091AA" letter-spacing="1">01 DESIGN</text>
  <text x="38" y="84" font-size="15" font-weight="700" fill="#1B2432">Data Standardization</text>
  <text x="38" y="104" font-size="15" font-weight="700" fill="#1B2432">Designer</text>
  <line x1="38" y1="120" x2="250" y2="120" stroke="#E3E7ED" stroke-width="1"/>

  <circle cx="43" cy="146" r="3" fill="#0091AA"/>
  <text x="56" y="150" font-size="12.5" font-weight="600" fill="#1B2432">DAMA-DMBOK Architecture</text>
  <text x="56" y="168" font-size="11" fill="#6B7684">글로벌 데이터 관리 표준으로</text>
  <text x="56" y="184" font-size="11" fill="#6B7684">거버넌스 구조를 설계</text>

  <circle cx="43" cy="216" r="3" fill="#0091AA"/>
  <text x="56" y="220" font-size="12.5" font-weight="600" fill="#1B2432">Standard Data Modeling</text>
  <text x="56" y="238" font-size="11" fill="#6B7684">전사 용어·도메인을 체계화</text>

  <circle cx="43" cy="270" r="3" fill="#0091AA"/>
  <text x="56" y="274" font-size="12.5" font-weight="600" fill="#1B2432">OECD Data Quality Control</text>
  <text x="56" y="292" font-size="11" fill="#6B7684">신뢰성·정밀성·완전성 검증</text>

  <rect x="38" y="392" width="212" height="62" rx="10" fill="#E6F4F7" stroke="#0091AA" stroke-width="1"/>
  <text x="50" y="414" font-size="9.5" font-weight="700" fill="#0091AA" letter-spacing="0.8">ARTIFACT</text>
  <text x="50" y="432" font-size="12" font-weight="700" fill="#0F3B45">Standard Metadata</text>
  <text x="50" y="447" font-size="12" font-weight="700" fill="#0F3B45">Repository</text>

  <!-- 화살표 1 → 2 -->
  <path d="M 284 250 H 306" stroke="#0091AA" stroke-width="2" stroke-dasharray="4 4"/>
  <polygon points="314,250 304,244 304,256" fill="#0091AA"/>

  <!-- ── 단계 2: Integration (가운데가 이 제품의 고유한 자리) ── -->
  <g filter="url(#wf-shadow)">
    <rect x="322" y="24" width="256" height="452" rx="14" fill="#FFFFFF" stroke="#0091AA" stroke-width="2"/>
  </g>
  <text x="344" y="58" font-size="11" font-weight="800" fill="#0091AA" letter-spacing="1">02 INTEGRATION</text>
  <text x="344" y="84" font-size="15" font-weight="800" fill="#1B2432">M³ Synthesizer</text>
  <line x1="344" y1="120" x2="556" y2="120" stroke="#E3E7ED" stroke-width="1"/>

  <circle cx="349" cy="146" r="3" fill="#0091AA"/>
  <text x="362" y="150" font-size="12.5" font-weight="600" fill="#1B2432">Master Data Integration</text>
  <text x="362" y="168" font-size="11" fill="#6B7684">핵심 기준 정보를 통합 관리</text>

  <circle cx="349" cy="200" r="3" fill="#0091AA"/>
  <text x="362" y="204" font-size="12.5" font-weight="600" fill="#1B2432">Meta Data Mapping</text>
  <text x="362" y="222" font-size="11" fill="#6B7684">표준 저장소와 이어 데이터 간</text>
  <text x="362" y="238" font-size="11" fill="#6B7684">구조적 의미를 사상</text>

  <circle cx="349" cy="270" r="3" fill="#0091AA"/>
  <text x="362" y="274" font-size="12.5" font-weight="600" fill="#1B2432">Mart Data Structuring</text>
  <text x="362" y="292" font-size="11" fill="#6B7684">분석·RAG 에 맞춘 주제별 마트</text>

  <rect x="344" y="392" width="212" height="62" rx="10" fill="#E6F4F7" stroke="#0091AA" stroke-width="1.5"/>
  <text x="356" y="414" font-size="9.5" font-weight="700" fill="#0091AA" letter-spacing="0.8">ARTIFACT</text>
  <text x="356" y="433" font-size="12" font-weight="700" fill="#0F3B45">M³ Dataset</text>
  <text x="356" y="448" font-size="10" fill="#4A6570">Master · Meta · Mart</text>

  <!-- 화살표 2 → 3 -->
  <path d="M 590 250 H 612" stroke="#0091AA" stroke-width="2" stroke-dasharray="4 4"/>
  <polygon points="620,250 610,244 610,256" fill="#0091AA"/>

  <!-- ── 단계 3: Implementation ───────────────────────── -->
  <g filter="url(#wf-shadow)">
    <rect x="628" y="24" width="256" height="452" rx="14" fill="#FFFFFF" stroke="#E3E7ED" stroke-width="1"/>
  </g>
  <text x="650" y="58" font-size="11" font-weight="800" fill="#0091AA" letter-spacing="1">03 IMPLEMENTATION</text>
  <text x="650" y="84" font-size="15" font-weight="700" fill="#1B2432">Semantic Engine</text>
  <line x1="650" y1="120" x2="862" y2="120" stroke="#E3E7ED" stroke-width="1"/>

  <circle cx="655" cy="146" r="3" fill="#0091AA"/>
  <text x="668" y="150" font-size="12.5" font-weight="600" fill="#1B2432">Ontology Classes</text>
  <text x="668" y="168" font-size="11" fill="#6B7684">엔티티를 의미론적 범주로</text>

  <circle cx="655" cy="200" r="3" fill="#0091AA"/>
  <text x="668" y="204" font-size="12.5" font-weight="600" fill="#1B2432">Ontology Relations</text>
  <text x="668" y="222" font-size="11" fill="#6B7684">엔티티 간 다차원 연관 관계로</text>
  <text x="668" y="238" font-size="11" fill="#6B7684">지식 네트워크를 구축</text>

  <circle cx="655" cy="270" r="3" fill="#0091AA"/>
  <text x="668" y="274" font-size="12.5" font-weight="600" fill="#1B2432">Ontology Rules</text>
  <text x="668" y="292" font-size="11" fill="#6B7684">비즈니스 로직과 추론 규칙 이식</text>

  <rect x="650" y="392" width="212" height="62" rx="10" fill="#E6F4F7" stroke="#0091AA" stroke-width="1"/>
  <text x="662" y="414" font-size="9.5" font-weight="700" fill="#0091AA" letter-spacing="0.8">ARTIFACT</text>
  <text x="662" y="433" font-size="12" font-weight="700" fill="#0F3B45">Business Context</text>
  <text x="662" y="448" font-size="12" font-weight="700" fill="#0F3B45">Object</text>

  <!-- 아래 한 줄 — 이 파이프라인이 무엇을 위한 것인지 -->
  <rect x="16" y="492" width="868" height="34" rx="9" fill="#FFFFFF" stroke="#E3E7ED" stroke-width="1"/>
  <text x="450" y="514" font-size="12" font-weight="600" fill="#4A5568" text-anchor="middle">레거시 데이터를 AI 가 이해하는 비즈니스 객체로 — 표준 설계에서 시맨틱 구현까지</text>
</svg>
