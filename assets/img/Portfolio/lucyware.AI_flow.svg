<!-- 홈 Solution 구역용 간단 도식.
     상세 페이지의 lucyware.AI_architecture.svg 를 세 단계로 줄인 것이다 —
     그쪽은 800×600 에 9px 글자까지 들어 있어 홈의 절반 폭(약 520px)에서는
     읽히지 않는다. 여기서는 단계 이름만 남기고 글자를 키웠다.

     비율은 5:4 로, 옆 칸(.alt__media)과 같은 비율이다.
     글꼴은 base.css 의 font-sans 토큰과 같은 스택을 적어 둔다. 이 파일은 img
     태그로 불려서 사이트 CSS 가 닿지 않으므로, 여기 적지 않으면 본문과 다른
     글꼴로 그려진다. 사이트 글꼴이 바뀌면 이 줄도 함께 바꾼다.
     (XML 주석 안에는 하이픈 두 개를 연달아 쓸 수 없다. CSS 변수 이름을
      그대로 적으면 그 순간 파일 전체가 파싱 오류로 안 그려진다.)
     색은 상세 페이지 구조도와 같은 팔레트를 쓴다 — 같은 그림의 요약으로
     보여야 하므로 색이 달라지면 안 된다. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" width="520" height="400"
     role="img" aria-label="Lucyware.AI 3단계 흐름도"
     style="font-family: 'Pretendard Variable', Pretendard, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;">
  <defs>
    <linearGradient id="flow-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0D111D"/>
    </linearGradient>
    <filter id="flow-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feComposite in="SourceGraphic" in2="b" operator="over"/>
    </filter>
  </defs>

  <rect width="520" height="400" fill="url(#flow-bg)"/>

  <!-- 배경 격자 — 상세 구조도와 같은 결 -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <path d="M 130 0 V 400 M 260 0 V 400 M 390 0 V 400"/>
    <path d="M 0 100 H 520 M 0 200 H 520 M 0 300 H 520"/>
  </g>

  <!-- 1. 레거시 -->
  <g>
    <rect x="28" y="28" width="464" height="84" rx="12" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
    <circle cx="56" cy="70" r="7" fill="none" stroke="#38BDF8" stroke-width="2"/>
    <text x="78" y="64" font-size="17" font-weight="700" fill="#F8FAFC">Legacy Systems</text>
    <text x="78" y="88" font-size="13" fill="#94A3B8">정형 DB · 문서 · 업무 규칙</text>
  </g>

  <path d="M 260 122 V 144" stroke="#00F2FE" stroke-width="2" stroke-dasharray="4 4" opacity="0.7"/>
  <polygon points="260,152 254,142 266,142" fill="#00F2FE"/>

  <!-- 2. 온톨로지 — 가운데가 핵심이라 테두리와 글자색으로만 힘을 준다 -->
  <g>
    <rect x="28" y="158" width="464" height="84" rx="12" fill="#1E1B4B" stroke="#6366F1" stroke-width="2" filter="url(#flow-glow)"/>
    <circle cx="56" cy="200" r="7" fill="#4338CA" stroke="#00F2FE" stroke-width="2"/>
    <text x="78" y="194" font-size="17" font-weight="800" fill="#00F2FE">Ontology Data Mart</text>
    <text x="78" y="218" font-size="13" fill="#A5B4FC">지식 그래프 · 벡터 + 그래프 검색</text>
  </g>

  <path d="M 260 252 V 274" stroke="#00F2FE" stroke-width="2" stroke-dasharray="4 4" opacity="0.7"/>
  <polygon points="260,282 254,272 266,272" fill="#00F2FE"/>

  <!-- 3. 신뢰할 수 있는 답 -->
  <g>
    <rect x="28" y="288" width="464" height="84" rx="12" fill="#0F172A" stroke="#10B981" stroke-opacity="0.5" stroke-width="1.5"/>
    <circle cx="56" cy="330" r="7" fill="none" stroke="#34D399" stroke-width="2"/>
    <text x="78" y="324" font-size="17" font-weight="700" fill="#34D399">Trusted Output</text>
    <text x="78" y="348" font-size="13" fill="#94A3B8">환각 없는 답 · 근거 추적 · 권한</text>
  </g>
</svg>
